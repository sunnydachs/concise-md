[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concise-md"
version = "0.1.0"
description = "A deterministic, offline filter that turns verbose AI Markdown into conclusion, minimal code, and verification steps."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
concise = "concise.cli:main"
